<!-- Item 2.c (tambahan): Form Tambah Akun, sesuai tabel users di proposal -->
<section class="kartu kartu-form">
    <div class="kartu-judul">
        <h2><i class="fa-solid fa-user-plus"></i> Form Tambah Akun</h2>
        <a href="pages/kelola-akun.html" class="link-ajax" data-halaman="kelola-akun"><i class="fa-solid fa-arrow-left"></i> Kembali ke daftar akun</a>
        <p>Akun hanya dibuat oleh admin (tidak ada pendaftaran mandiri). Kolom bertanda <span style="color:#D93A3A">*</span> wajib diisi.</p>
    </div>

    <div class="ringkasan-salah" id="ringkasanSalahAkun"></div>

    <!-- novalidate: validasi bawaan browser dimatikan, validasi dilakukan oleh JavaScript -->
    <form id="formAkun" action="server/simpan.json" method="post" novalidate>
        <div class="form-baris">
            <div class="form-grup" id="grup-nama">
                <label for="nama">Nama Lengkap <span class="wajib">*</span></label>
                <input type="text" id="nama" name="nama" maxlength="100" placeholder="contoh: Andi Saputra">
                <span class="pesan-salah"></span>
            </div>

            <div class="form-grup" id="grup-email">
                <label for="email">Email <span class="wajib">*</span></label>
                <input type="email" id="email" name="email" maxlength="100" placeholder="nama@domain.com">
                <span class="petunjuk">Dipakai untuk login, tidak boleh sama dengan akun lain.</span>
                <span class="pesan-salah"></span>
            </div>

        </div>
        <div class="form-baris">
            <div class="form-grup" id="grup-role">
                <label for="role">Role <span class="wajib">*</span></label>
                <select id="role" name="role">
                    <option value="">-- Pilih role --</option>
                    <option value="mahasiswa">Mahasiswa</option>
                    <option value="pembimbing">Pembimbing Magang</option>
                    <option value="dosen">Dosen</option>
                    <option value="admin">Admin</option>
                </select>
                <span class="pesan-salah"></span>
            </div>

            <div class="form-grup" id="grup-nomor_induk">
                <label for="nomor_induk" id="labelNomorInduk">Nomor Induk</label>
                <input type="text" id="nomor_induk" name="nomor_induk" maxlength="30" placeholder="Pilih role terlebih dahulu" disabled>
                <span class="petunjuk" id="petunjukNomorInduk">NIM untuk mahasiswa, NIP untuk dosen.</span>
                <span class="pesan-salah"></span>
            </div>

        </div>
        <div class="form-baris">
            <div class="form-grup" id="grup-no_hp">
                <label for="no_hp">No HP <span class="wajib">*</span></label>
                <input type="tel" id="no_hp" name="no_hp" maxlength="13" placeholder="08xxxxxxxxxx">
                <span class="pesan-salah"></span>
            </div>

            <div class="form-grup checkbox-baris" id="grup-is_active">
                <label style="display:block;font-weight:500;margin-bottom:6px">Status Akun</label>
                <input type="checkbox" id="is_active" name="is_active" checked>
                <label for="is_active">Langsung aktifkan akun</label>
            </div>

        </div>
        <div class="form-baris">
            <div class="form-grup" id="grup-password">
                <label for="password">Password <span class="wajib">*</span></label>
                <div class="kotak-password">
                    <input type="password" id="password" name="password" maxlength="64" placeholder="Minimal 8 karakter">
                    <button type="button" class="lihat-password" data-target="password" aria-label="Lihat password"><i class="fa-regular fa-eye"></i></button>
                </div>
                <span class="petunjuk">Minimal 8 karakter, kombinasi huruf dan angka.</span>
                <span class="pesan-salah"></span>
            </div>

            <div class="form-grup" id="grup-konfirmasi">
                <label for="konfirmasi">Ulangi Password <span class="wajib">*</span></label>
                <div class="kotak-password">
                    <input type="password" id="konfirmasi" name="konfirmasi" maxlength="64" placeholder="Ketik ulang password">
                    <button type="button" class="lihat-password" data-target="konfirmasi" aria-label="Lihat password"><i class="fa-regular fa-eye"></i></button>
                </div>
                <span class="pesan-salah"></span>
            </div>
        </div>

        <div class="aksi-form">
            <button type="reset" class="btn btn-sekunder" id="btnBersihAkun">Kosongkan</button>
            <button type="submit" class="btn" id="btnSimpanAkun"><i class="fa-solid fa-floppy-disk"></i> Simpan Akun</button>
        </div>
    </form>
</section>
